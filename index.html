<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111416"><meta name="robots" content="noindex,nofollow"><title>Occam-Timer</title><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Dunkles Performance-Design: Orange als Signalfarbe, große Ziffern, Bedienung mit dem Daumen unten */
:root{
  --bg:#111416; --card:#1C2225; --raise:#252D30; --fg:#F2F3EF; --muted:#9AA4A8; --line:#343C3F;
  --acc:#F28C28; --blue:#527B91; --down:#7FA7BC; --hold:#F2B33D; --ok:#6FBF7A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.app{max-width:720px}}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:38px;height:30px;flex:none}
h1{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;letter-spacing:.03em;margin:0;line-height:1;text-transform:uppercase}
.tag{font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.sub{color:var(--muted);font-size:13px;white-space:nowrap}
.app:not([data-view=home]) .tag{display:none}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .2s}
button{font:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:12px 14px;min-height:52px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:border-color .15s,background .15s}
button:active{background:var(--raise)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary,button.fail{background:var(--acc);border-color:var(--acc);color:#141414;font-weight:700}
button.primary:active,button.fail:active{background:#d9761a}
button.big{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-height:64px;width:100%}
button.big svg.i{width:24px;height:24px;fill:currentColor;stroke:none}
button.huge{min-height:13vh;font-size:34px}
.iconbtn{width:48px;min-height:48px;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wo{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;gap:6px;padding:14px 12px;min-height:120px}
.wo b{font-family:var(--display);font-size:19px;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.wo span{font-size:12px;color:var(--muted);line-height:1.35}
.wo > svg.i{color:var(--down);width:22px;height:22px}
.wo.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:linear-gradient(160deg,rgba(242,140,40,.12),var(--card) 60%)}
.wo.sel > svg.i{color:var(--acc)}
.badge{position:absolute;bottom:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#141414;display:none;place-items:center}
.wo.sel .badge{display:grid}
.badge svg.i{width:13px;height:13px;stroke-width:3.5}
.wo.fig{min-height:156px;background:linear-gradient(90deg,var(--card) 22%,rgba(28,34,37,.7) 48%,rgba(28,34,37,0) 78%),var(--fig) right bottom / auto 94% no-repeat,var(--card)}
.wo.fig.sel{background:linear-gradient(90deg,#2a2621 22%,rgba(42,38,33,.7) 48%,rgba(42,38,33,0) 78%),var(--fig) right bottom / auto 94% no-repeat,var(--card)}
.wo.fig b,.wo.fig span{text-shadow:0 1px 3px rgba(0,0,0,.9)}
.wo.fig span{color:#C3CACD;max-width:78%}
.exthumb{width:88px;height:54px;border-radius:10px;background:var(--raise) center / cover no-repeat;flex:none}
.rec{font-size:10px;color:var(--ok)!important;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.list li.x{padding:0}
.exd summary,.exrow{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.exd summary::-webkit-details-marker{display:none}
.exd .chev{margin-left:auto;color:var(--muted)}
.exd[open] .chev{transform:rotate(90deg)}
.exd .cue{padding:0 14px 14px 114px;margin:0;font-size:14px}
.exi{width:38px;height:38px;border-radius:10px;background:var(--raise);display:grid;place-items:center;color:var(--acc);flex:none}
.exb{display:flex;flex-direction:column;gap:2px;min-width:0}
.n{font-weight:600}
.m{font-size:13px;color:var(--muted)}
.params{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.params div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.params strong{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.params span{font-size:9px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
details#settings{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
details#settings > summary{display:flex;align-items:center;justify-content:space-between;min-height:52px;cursor:pointer;font-weight:600;list-style:none}
details#settings > summary::-webkit-details-marker{display:none}
details#settings[open] > summary svg.i{transform:rotate(180deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field input[type=number],.field input[type=text],.field select{font:inherit;font-variant-numeric:tabular-nums;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--fg);min-height:46px;box-sizing:border-box;width:100%}
input[type=range]{width:100%;accent-color:var(--acc);min-height:32px;margin:0}
.check{display:flex;gap:12px;align-items:center;grid-column:1/-1;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.stage{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.phase{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.phase.up{color:var(--acc)} .phase.down{color:var(--down)} .phase.hold{color:var(--hold)} .phase.ok{color:var(--ok)}
.ringwrap{position:relative;width:min(70vw,300px,36vh);aspect-ratio:1;margin:0 auto;flex:none}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.rbg{stroke:var(--raise)}
.rfg{stroke:var(--acc);stroke-linecap:round}
.clock{font-family:var(--display);font-weight:700;font-size:min(28vw,120px,17vh);line-height:1;font-variant-numeric:tabular-nums;text-align:center;color:var(--acc)}
.ringwrap .clock{position:absolute;inset:0;display:grid;place-items:center}
[data-view=rest] .clock,[data-view=cool] .clock,[data-view=lower] .clock,[data-view=switch] .clock,[data-view=warmrest] .clock,
[data-ivk=easy] .clock,[data-ivk=warm] .clock,[data-ivk=cool] .clock{color:var(--down)}
[data-view=rest] .rfg,[data-view=cool] .rfg,[data-view=lower] .rfg,[data-view=switch] .rfg,[data-view=warmrest] .rfg,
[data-ivk=easy] .rfg,[data-ivk=warm] .rfg,[data-ivk=cool] .rfg{stroke:var(--blue)}
[data-view=hold] .clock{color:var(--hold)} [data-view=hold] .rfg{stroke:var(--hold)}
[data-ph=down] .clock{color:var(--down)} [data-ph=down] .rfg{stroke:var(--blue)}
.bar i.full{background:var(--ok)}
.ex{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.cue{color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;gap:2px}
.stats strong{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{position:relative;height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);width:0}
.marks{position:relative;height:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.marks span{position:absolute;transform:translateX(-50%)}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.6}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.row{display:flex;gap:10px} .row>*{flex:1}
.note{font-size:14px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
pre.sum{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0}
.recst{font-size:13px;color:var(--muted);text-align:center}
.dock{position:sticky;bottom:0;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,rgba(17,20,22,0))}
@media (orientation:landscape) and (max-height:560px){
  .stage{display:grid;grid-template-columns:auto 1fr;column-gap:24px;align-content:start}
  .stage > *{grid-column:2}
  .stage > .ringwrap{grid-column:1;grid-row:1 / span 12;width:min(78vh,300px)}
  .clock{font-size:min(26vh,110px)}
  button.huge{min-height:22vh}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sub.wrap{white-space:normal;line-height:1.4}
.row button{min-width:0}
/* Mikrofon-Anzeige: Zeile mit Zustand und Pegel, der Strich ist die Schwelle */
.mic{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:40px}
.mic svg.i{width:18px;height:18px;color:var(--muted)}
.mic[data-on="1"] svg.i{color:var(--ok)}
.mic[data-hot="1"]{border-color:var(--acc)}
.mic #micst{flex:1;min-width:0}
.lv{position:relative;flex:none;width:72px;height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.lv i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ok)}
.lv b{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.lv.big{width:100%;height:28px;border-radius:8px}
.lv.big b{width:3px;background:var(--acc)}
.lv em{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--fg)}
.tbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tbox[data-flash="1"]{border-color:var(--ok);background:rgba(111,191,122,.16)}
.tbox .phase{text-align:left;font-size:24px}
.tcount{display:flex;flex-direction:column;align-items:center;gap:2px}
.tcount strong{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.note:empty{display:none}
</style>

function tonePcm(parts){
  const n = parts.reduce((a, p) => a + Math.round(SR * p[1] / 1000), 0), out = new Float32Array(n);
  let o = 0;
  for(const [f, ms] of parts){
    const len = Math.round(SR * ms / 1000), fade = Math.min(len / 2, SR * 0.008);
    if(f) for(let i = 0; i < len; i++){
      const env = Math.min(1, i / fade, (len - i) / fade), p = 2 * Math.PI * f * i / SR;
      out[o + i] = (Math.sin(p) + 0.3 * Math.sin(2 * p)) / 1.3 * env;
    }

  }

}

    try{
      if(this.mode === "wa"){
        if(this.ctx.state !== "running") this.ctx.resume().catch(() => {});
        const s = this.ctx.createBufferSource(); s.buffer = this.bufs[k]; s.connect(this.gain); s.start();
      } else {
        const a = this.pool[this.pi++ % this.pool.length]; a.src = this.urls[k];
        const p = a.play(); if(p && p.catch) p.catch(() => {});
      }
    }catch(e){}
  },
  setVol(){ if(this.gain) this.gain.gain.value = cfg.vol; if(this.ready && this.mode === "el") this.buildEls(false); }
};

// ---------- Ansage (nur Countdown und Laufphasen) ----------
let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang));
    const score = v => (/premium|enhanced|erweitert|natural|neural/i.test(v.name) ? 4 : 0) + (/google|anna|petra|helena|katja|markus|viktor|yannick|martin/i.test(v.name) ? 2 : 0) + (/de[-_]DE/i.test(v.lang) ? 1 : 0);
    voice = vs.sort((a, b) => score(b) - score(a))[0] || null;
  }catch(e){}
}
try{ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }catch(e){}
const micBusy = () => cfg.trigger === "ruf" && Mic.on;
function speak(t){
  // Solange das Mikrofon für den Ruf zuhört, bleibt die Stimme aus: Am iPhone kann sie Aufnahme und Töne unterbrechen
  if(!cfg.voice || micBusy()) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = "de-DE"; if(voice) u.voice = voice; u.rate = 1.05; u.volume = Math.min(1, cfg.vol);
    speechSynthesis.speak(u);
    Snd.busyUntil = Math.max(Snd.busyUntil, performance.now() + 900);
  }catch(e){}
}
function unlockSpeech(){ if(micBusy()) return; try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }catch(e){} }
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} }

// ---------- Auslöser über das Mikrofon ----------
// "ruf": ein lauter Ruf (Lautstärke über der Schwelle für cfg.shout ms). Läuft ohne Spracherkennung, also auch offline.
// "wort": Spracherkennung des Browsers, erkennt „Start“ und „Versagen“.
const lvPos = x => Math.max(0, Math.min(1, Math.log(Math.max(x, 1e-4) / 0.003) / Math.log(0.7 / 0.003)));
const lvInv = p => 0.003 * Math.pow(0.7 / 0.003, p);
const Mic = {
  on:false, state:"aus", err:"", stream:null, src:null, an:null, data:null, id:null, rec:null,
  level:0, peak:0, above:0, lastFire:0, heard:"", cal:null, run:0, runPeak:0, lastRun:null,
  canRuf(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && AC); },
  canWort(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  set(s){ this.state = s; paintMic(); },
  blockedText(){ return EMBED ? "in claude.ai gesperrt" : "nicht erlaubt"; },
  async start(){
    if(this.on || cfg.trigger === "aus") return;
    this.err = "";
    if(cfg.trigger === "wort") return this.startWort();
    if(!this.canRuf()){ this.set("hier nicht verfügbar"); return; }
    this.on = true; this.set("fragt nach dem Mikrofon …");
    try{
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      if(!this.on){ this.stream.getTracks().forEach(t => t.stop()); this.stream = null; return; }
      const ctx = Snd.ctx || (Snd.ctx = new AC());
      if(ctx.state !== "running") await ctx.resume().catch(() => {});
      this.src = ctx.createMediaStreamSource(this.stream);
      this.an = ctx.createAnalyser(); this.an.fftSize = 1024; this.src.connect(this.an);
      this.data = this.an.getFloatTimeDomainData ? new Float32Array(this.an.fftSize) : new Uint8Array(this.an.fftSize);
      this.id = setInterval(() => this.tick(), 50);
      this.set("hört zu");
    }catch(e){
      this.on = false; this.err = (e && e.name) || "Fehler";
      this.set(/NotAllowed|Security/.test(this.err) ? this.blockedText() : /NotFound|Overconstrained/.test(this.err) ? "kein Mikrofon gefunden" : "Fehler (" + this.err + ")");
    }
  },
  tick(){
    const d = this.data, n = d.length; let sum = 0;
    if(d instanceof Float32Array){ this.an.getFloatTimeDomainData(d); for(let i = 0; i < n; i++) sum += d[i] * d[i]; }
    else { this.an.getByteTimeDomainData(d); for(let i = 0; i < n; i++){ const v = (d[i] - 128) / 128; sum += v * v; } }
    const rms = Math.sqrt(sum / n), t = performance.now(), masked = t < Snd.busyUntil;
    this.level = rms; this.peak = Math.max(rms, this.peak * 0.93);
    if(this.cal && !masked) this.cal(rms);
    // Für den Test mitschreiben, wie lang und wie laut der letzte Laut über der Schwelle war
    if(!masked && rms >= cfg.thr){ this.run += 50; this.runPeak = Math.max(this.runPeak, rms); }
    else if(this.run){ this.lastRun = { ms:this.run, peak:this.runPeak }; this.run = 0; this.runPeak = 0; if(S.view === "mictest") paintTest(); }
    // Eigene Töne zählen nicht; kurze Einbrüche im Ruf werden verziehen
    if(!masked && rms >= cfg.thr) this.above += 50; else this.above = Math.max(0, this.above - (masked ? 0 : 100));
    if(this.above >= cfg.shout && t - this.lastFire > 1500){ this.lastFire = t; this.above = 0; trigger("ruf"); }
    paintLevel();
  },
  startWort(){
    if(!this.canWort()){ this.set("in diesem Browser nicht verfügbar"); return; }
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = this.rec = new R(); rec.lang = "de-DE"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      for(let i = e.resultIndex; i < e.results.length; i++){
        const txt = e.results[i][0].transcript.toLowerCase().trim();
        this.heard = txt; paintMic(); trigger("wort", txt);
      }
    };
    rec.onerror = e => {
      this.err = e.error || "";
      if(e.error === "not-allowed" || e.error === "service-not-allowed"){ this.on = false; this.set(this.blockedText()); }
      else if(e.error === "audio-capture"){ this.on = false; this.set("kein Mikrofon gefunden"); }
    };
    rec.onstart = () => this.set("hört zu");
    rec.onend = () => { if(this.on && this.rec === rec){ setTimeout(() => { try{ rec.start(); }catch(err){} }, 250); } };
    this.on = true;
    try{ rec.start(); this.set("startet …"); }catch(err){ this.on = false; this.err = String(err && err.name); this.set("konnte nicht starten"); }
  },
  stop(){
    this.on = false; this.cal = null;
    if(this.id){ clearInterval(this.id); this.id = null; }
    try{ this.src && this.src.disconnect(); }catch(e){}
    try{ this.stream && this.stream.getTracks().forEach(t => t.stop()); }catch(e){}
    try{ this.rec && this.rec.abort(); }catch(e){}
    this.src = this.an = this.stream = this.rec = null; this.level = 0; this.above = 0;
    this.state = "aus";
  }
};
function trigger(src, txt){
  const v = S.view, t = performance.now();
  if(v === "mictest"){
    if(src === "wort"){ const hit = /versag|stopp|nicht mehr|geht nicht|fertig/.test(txt) ? "Versagen" : /start|los/.test(txt) ? "Start" : ""; if(!hit || t - (S.hitAt || 0) < 1500) return; S.hit = hit; }
    S.hitAt = t; S.fires = (S.fires || 0) + 1; Snd.play("up"); paintTest(); return;
  }
  if(src === "wort"){
    if(t - (S.wortAt || 0) < 1500) return;
    if(/versag|stopp|nicht mehr|geht nicht|boah|fertig/.test(txt) && v === "set"){ S.wortAt = t; fail(); }
    else if(/start|los/.test(txt)){
      if(v === "ready"){ S.wortAt = t; clickPrimary(); }
      else if(v === "warmrest"){ S.wortAt = t; stopClock(); goLead(); }
    }
    return;
  }
  if(v === "set") fail();
  // Im Bereit-Bild erst nach zwei Sekunden, damit das Ablegen von Gewichten nichts startet
  else if(v === "ready" && t - (S.readyAt || 0) > 2000) clickPrimary();
}
function clickPrimary(){ const b = $("warm") || $("go"); if(b) b.click(); }
function micLine(){
  const st = Mic.state;
  if(cfg.trigger === "aus") return "";
  if(st !== "hört zu") return "Mikrofon: " + st + (Mic.on ? "" : " · bitte den Knopf benutzen");
  if(cfg.trigger === "wort") return "Hört zu · sag „" + (S.view === "set" ? "Versagen" : "Start") + "“" + (Mic.heard ? " · gehört: " + Mic.heard.slice(-28) : "");
  return "Hört zu · laut „" + (S.view === "set" ? "Stopp" : "Los") + "“ rufen";
}
function paintMic(){
  setText("micst", micLine());
  const m = $("mic"); if(m) m.dataset.on = Mic.state === "hört zu" ? "1" : "0";
  if(S.view === "mictest") paintTest();
}
function paintLevel(){
  const f = $("miclv"); if(f) f.style.width = (lvPos(Mic.level) * 100) + "%";
  const th = $("micth"); if(th) th.style.left = (lvPos(cfg.thr) * 100) + "%";
  const pk = $("micpk"); if(pk) pk.style.left = (lvPos(Mic.peak) * 100) + "%";
  const m = $("mic"); if(m) m.dataset.hot = Mic.above > 0 ? "1" : "0";
}
function micChip(){
  if(cfg.trigger === "aus") return "";
  return `<div class="mic" id="mic" data-on="${Mic.state === "hört zu" ? 1 : 0}">${ICO.mic}<span id="micst">${esc(micLine())}</span>${cfg.trigger === "ruf" ? `<span class="lv"><i id="miclv"></i><b id="micth" style="left:${lvPos(cfg.thr) * 100}%"></b></span>` : ""}</div>`;
}
function paintTest(){
  setText("t-state", "Mikrofon: " + Mic.state);
  setText("t-fires", S.fires || 0);
  setText("t-hit", cfg.trigger === "wort" ? (S.hit ? "Erkannt: " + S.hit : "Sag „Start“ oder „Versagen“") : (S.fires ? "Ausgelöst" : "Noch nicht ausgelöst"));
  setText("t-heard", cfg.trigger === "wort" ? (Mic.heard ? "Gehört: " + Mic.heard.slice(-60) : "Gehört: –") : "");
  setText("t-msg", S.calMsg || "");
  const lr = Mic.lastRun;
  setText("t-run", cfg.trigger === "ruf" && lr ? "Letzter Laut über dem Strich: " + lr.ms + " ms lang (nötig: " + cfg.shout + " ms), Spitze " + Math.round(lvPos(lr.peak) * 100) + " %, Strich bei " + Math.round(lvPos(cfg.thr) * 100) + " %" : "");
  setText("t-diag", "Fassung " + VERSION + " · Technik: Mikrofonzugriff " + (Mic.canRuf() ? "ja" : "nein") + " · Spracherkennung " + (Mic.canWort() ? "ja" : "nein") + " · " + (EMBED ? "eingebettet in claude.ai" : "eigener Tab") + " · Ton " + (Snd.mode === "wa" ? "Web Audio" : "Audio-Elemente") + (Mic.err ? " · Meldung: " + Mic.err : ""));
  const box = $("t-box"); if(box) box.dataset.flash = performance.now() - (S.hitAt || 0) < 900 ? "1" : "0";
}
// Schwelle selbst einstellen: erst Umgebung samt eigenen Tönen messen, dann den Ruf
function toneCheck(){
  if(Mic.state !== "hört zu" || cfg.trigger !== "ruf"){ S.calMsg = "Erst muss das Mikrofon zuhören."; paintTest(); return; }
  if(!Snd.pcm.go) Snd.unlock();
  const pct = x => Math.round(lvPos(x) * 100) + " %";
  const measure = (ms, cb) => { let mx = 0; const id = setInterval(() => { mx = Math.max(mx, Mic.level); }, 40); setTimeout(() => { clearInterval(id); cb(mx); }, ms); };
  Snd.busyUntil = performance.now() + 4000; S.calMsg = "Ton-Prüfung läuft, bitte still sein …"; paintTest();
  measure(600, base => {
    // Audio-Element
    try{ const a = new Audio(wavUrl(Snd.pcm.go, cfg.vol * 0.9)); a.play().catch(() => {}); }catch(e){}
    measure(900, el => {
      setTimeout(() => {
        // Web Audio
        let waState = "fehlt";
        try{ const c = Snd.ctx; waState = c.state; const b = c.createBuffer(1, Snd.pcm.go.length, SR); b.getChannelData(0).set(Snd.pcm.go); const g = c.createGain(); g.gain.value = cfg.vol; g.connect(c.destination); const s = c.createBufferSource(); s.buffer = b; s.connect(g); s.start(); }catch(e){ waState = "Fehler"; }
        measure(900, wa => {
          const heard = x => x > Math.max(base * 3, 0.01) ? "kommt an" : "kommt NICHT an";
          const tr = Mic.stream && Mic.stream.getAudioTracks()[0], st = tr && tr.getSettings ? tr.getSettings() : {};
          S.calMsg = "Ton-Prüfung: Ruhe " + pct(base) + " · Audio-Elemente " + pct(el) + " (" + heard(el) + ") · Web Audio " + pct(wa) + " (" + heard(wa) + ", Zustand " + waState + ") · Mikrofon " + (tr ? tr.readyState + (tr.muted ? ", stumm" : "") : "fehlt") + ", " + (st.sampleRate || "?") + " Hz, Echo " + st.echoCancellation + ", AGC " + st.autoGainControl + ".";
          paintTest();
        });
      }, 300);
    });
  });
}
function calibrate(){
  if(Mic.state !== "hört zu" || cfg.trigger !== "ruf"){ S.calMsg = "Erst muss das Mikrofon zuhören."; paintTest(); return; }
  const noise = [], shout = [];
  S.calMsg = "Schritt 1 von 2: Sei 3 Sekunden still."; paintTest();
  Mic.cal = r => noise.push(r);
  setTimeout(() => {
    if(S.view !== "mictest"){ Mic.cal = null; return; }
    Mic.cal = null; S.calMsg = "Schritt 2 von 2: Ruf nach dem Ton laut „Stopp“, so wie am Ende eines Satzes."; paintTest(); Snd.play("go");
    setTimeout(() => { Mic.cal = r => shout.push(r); }, 650);
    setTimeout(() => {
      Mic.cal = null; if(S.view !== "mictest") return;
      noise.sort((a, b) => b - a); shout.sort((a, b) => b - a);
      // Umgebung: der Wert, unter dem 90 % der Messungen liegen. Ruf: was mindestens 0,2 s lang erreicht wurde.
      const nz = noise[Math.floor(noise.length * 0.1)] || 0.003, sh = shout[3] || 0;
      if(sh < nz * 2.5){ S.calMsg = "Der Ruf war kaum lauter als die Umgebung (Ruf " + Math.round(lvPos(sh) * 100) + " %, Umgebung " + Math.round(lvPos(nz) * 100) + " %). Leg das Handy näher hin oder ruf lauter und versuch es noch einmal."; }
      else {
        // Schwelle bei knapp der halben Ruf-Lautstärke, aber klar über der Umgebung
        cfg.thr = Math.max(0.006, Math.min(0.6, Math.max(nz * 2, sh * 0.45))); save("ockham.cfg", cfg);
        const sl = $("c-thr"); if(sl) sl.value = Math.round(lvPos(cfg.thr) * 100);
        S.calMsg = "Schwelle eingestellt (Ruf " + Math.round(lvPos(sh) * 100) + " %, Umgebung " + Math.round(lvPos(nz) * 100) + " %, Strich jetzt bei " + Math.round(lvPos(cfg.thr) * 100) + " %). Ruf zur Probe noch einmal „Stopp“: Es muss piepen.";
      }
      paintTest(); paintLevel();
    }, 4200);
  }, 3000);
}

async function keepAwake(){ try{ if("wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseAwake(){ try{ wake && wake.release(); }catch(e){} wake = null; }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.view !== "home"){ wake = null; keepAwake(); } });

// ---------- Zeitgeber ----------
function startClock(onTick){
  stopClock();
  const me = timer = { t0:tnow(), paused:false, pausedAt:0, offset:0 };
  const step = () => { if(timer === me && !me.paused) onTick((tnow() - me.t0 - me.offset) / 1000); };
  me.id = setInterval(step, 25); step();
}
function stopClock(){ if(timer){ clearInterval(timer.id); timer = null; } }
function togglePause(){
  if(!timer) return;
  if(timer.paused){ timer.offset += tnow() - timer.pausedAt; timer.paused = false; }
  else { timer.paused = true; timer.pausedAt = tnow(); stopSpeech(); }
  setText("pause", timer.paused ? "Weiter" : "Pause");
}
// Läuft flüssig von sec auf 0. ticks = so viele letzte Sekunden bekommen einen Tick, say = Zahlen ansagen,
// marks = Töne bei bestimmten Restsekunden, end = Ton am Ende (null = keiner)
function countdown(sec, onEnd, opts={}){
  const ticks = opts.ticks === undefined ? 3 : opts.ticks, end = opts.end === undefined ? "go" : opts.end;
  let lastLeft = null;
  startClock(el => {
    const left = Math.max(0, Math.ceil(sec - el));
    setText("clock", sec >= 60 ? fmt(left) : left);
    setRing(1 - el / sec);
    if(left !== lastLeft){
      const first = lastLeft === null; lastLeft = left;
      if(left > 0 && !first){
        if(opts.marks && opts.marks[left]) Snd.play(opts.marks[left]);
        else if(left <= ticks) Snd.play("tick");
      }
      if(left > 0 && left <= 3 && opts.say && (!first || sec <= 3)) speak(NUM[left]);
    }
    if(el >= sec){ stopClock(); if(end) Snd.play(end); onEnd(); }
  });
}
function fmt(s){ return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

// ---------- Ablauf ----------
function items(){ return WORKOUTS[S.wo].items.filter(i => cfg.opt || !i.optional); }
function current(){ return items()[S.i]; }
function begin(){
  Snd.unlock(); Mic.start(); unlockSpeech(); keepAwake();
  S = { view:"ready", wo:S.wo, i:0, side:0, results:[], started:new Date(), readyAt:performance.now() };
  render();
}
function toReady(){ S.view = "ready"; S.readyAt = performance.now(); render(); }
function startWarmup(){
  S.view = "warmup"; S.repInfo = null; render();
  countdown(3, () => runReps({ up:1, down:2, maxReps:3, onDone:() => {
    S.view = "warmrest"; render();
    countdown(60, goLead, { say:true, end:null });
  }}), { say:true, end:null });
}
function goLead(){ S.view = "go"; render(); countdown(cfg.lead, startSet, { say:true, end:null }); }
function startSet(){
  const ex = current();
  if(ex.kind === "count") return startCount();
  S.view = "set"; S.repInfo = { reps:0, el:0 }; render();
  runReps({ up:cfg.up, down:cfg.down, tut:true });
}
function runReps({ up, down, maxReps=Infinity, tut=false, onDone }){
  const first = current().first || "up";
  const U = { n:"Hoch", c:"up", len:up }, D = { n:"Runter", c:"down", len:down };
  const a = first === "up" ? U : D, b = first === "up" ? D : U, rep = up + down;
  const m1 = cfg.target - 20, m2 = cfg.target, m3 = cfg.target + 20;
  let lastKey = -1, did1 = false, did2 = false;
  startClock(el => {
    const reps = Math.floor(el / rep), pos = el - reps * rep, ph = pos < a.len ? a : b;
    const inEl = ph === a ? pos : pos - a.len, key = reps * 2 + (ph === a ? 0 : 1);
    if(key !== lastKey){
      lastKey = key;
      if(reps >= maxReps){ stopClock(); Snd.play("go"); onDone && onDone(); return; }
      Snd.play(ph.c);
      const pe = $("phase"); if(pe){ pe.textContent = ph.n; pe.className = "phase " + ph.c; }
      $("app").dataset.ph = ph.c;
    }
    if(S.repInfo) S.repInfo = { reps, el, frac: Math.min(.9, Math.floor(pos / rep * 10) / 10) };
    setText("clock", Math.min(ph.len, Math.floor(inEl) + 1));
    setText("reps", reps); setText("tut", Math.floor(el));
    setRing(inEl / ph.len);
    const bar = $("barfill"); if(bar){ bar.style.width = Math.min(100, el / m3 * 100) + "%"; bar.classList.toggle("full", el >= m2); }
    // Die Marken kommen 0,6 s nach dem Phasenton, damit beide zu hören sind
    if(tut && !did1 && el >= m1 + 0.6){ did1 = true; Snd.play("min"); }
    if(tut && !did2 && el >= m2 + 0.6){ did2 = true; Snd.play("goal"); }
  });
}
function startCount(){
  S.view = "count"; S.cntEl = 0; render(); Snd.play("go");
  startClock(el => { S.cntEl = el; setText("clock", fmt(Math.floor(el))); });
}
function countDone(){
  stopClock(); const ex = current();
  S.cur = { s0:{ reps:ex.reps, tut:Math.round(S.cntEl || 0) } };
  S.view = "result"; render(); Snd.play("done");
}
function fail(){
  if(S.view !== "set") return;
  stopClock();
  const info = S.repInfo || { reps:0, el:0, frac:0 };
  S.cur = S.cur || {};
  S.cur["s" + S.side] = { reps: +(info.reps + (info.frac || 0)).toFixed(1), tut: Math.round(info.el) };
  if(cfg.hold > 0){
    S.view = "hold"; render(); Snd.play("hold");
    countdown(cfg.hold, lowerPhase, { ticks:99, end:null });
  } else lowerPhase();
}
function lowerPhase(){
  S.view = "lower"; render(); Snd.play("lower");
  countdown(cfg.lower, afterSet, { ticks:3, end:null });
}
function afterSet(){
  const ex = current();
  if(ex.sides === 2 && S.side === 0){
    S.side = 1; S.view = "switch"; render(); Snd.play("warn");
    countdown(15, goLead, { say:true, end:null });
    return;
  }
  S.view = "result"; render(); Snd.play("done");
}
function saveResult(){
  const ex = current();
  const w = $("w").value.trim();
  const num = id => parseFloat(($(id).value || "0").replace(",", ".")) || 0;
  const res = { id:ex.id, name:ex.name, weight:w, reps:[num("r0")], tut:[S.cur.s0 ? S.cur.s0.tut : 0] };
  if(ex.sides === 2){ res.reps.push(num("r1")); res.tut.push(S.cur.s1 ? S.cur.s1.tut : 0); }
  S.results.push(res);
  last[ex.id] = { weight:w, reps:res.reps, date:new Date().toLocaleDateString("de-DE") };
  save("ockham.last", last);
  nextItem();
}
const REST_MARKS = { 30:"warn", 10:"warn" };
function nextItem(){
  S.cur = null; S.side = 0;
  const list = items();
  if(S.i < list.length - 1){
    S.i++; S.view = "rest"; render();
    countdown(cfg.rest, toReady, { say:true, marks:REST_MARKS });
  } else if(WORKOUTS[S.wo].cooldown){
    S.view = "cool"; render();
    countdown(180, finish, { say:true, marks:REST_MARKS, end:null });
  } else finish();
}
function finish(){ Mic.stop(); stopClock(); S.view = "done"; render(); Snd.play("done"); releaseAwake(); }
function abort(){ Mic.stop(); stopClock(); stopSpeech(); releaseAwake(); S = { view:"home", wo:S.wo }; render(); }

// ---------- Intervalllauf ----------
function ivWeek(){ const d = Math.floor((new Date() - IV_START) / 864e5); return d < 0 ? 0 : Math.floor(d / 7) + 1; }
function ivRec(){ const w = ivWeek(); return w >= 5 ? "w5" : w >= 3 ? "w3" : "w1"; }
function ivDesc(){ const v = cfg.iv; return v.rounds + " × " + v.fast + " s / " + v.easy + " s"; }
function ivPlan(){
  const v = cfg.iv, p = [{ kind:"warm", len:v.warm * 60, round:0 }];
  for(let i = 1; i <= v.rounds; i++){
    p.push({ kind:"fast", len:v.fast, round:i });
    if(i < v.rounds) p.push({ kind:"easy", len:v.easy, round:i });
  }
  p.push({ kind:"cool", len:v.cool * 60, round:v.rounds });
  return p.filter(x => x.len > 0);
}
const IV_NAME = { warm:"Einlaufen", fast:"Zügig", easy:"Locker", cool:"Auslaufen" };
const IV_CLASS = { warm:"ok", fast:"up", easy:"down", cool:"ok" };
const IV_CUE = { warm:"Locker traben, Schultern und Arme locker.", fast:"Kontrolliert schnell, etwa 80–85 %. Kein Maximalsprint.",
  easy:"Locker joggen oder gehen, Atem beruhigen.", cool:"Locker austraben, danach trinken." };
function ivBegin(){
  Snd.unlock(); unlockSpeech(); keepAwake();
  const plan = ivPlan();
  S = { view:"iv", wo:"I", plan, k:0, before:0, total:plan.reduce((a, x) => a + x.len, 0), started:new Date() };
  ivPhase();
}
function ivPhase(){
  if(S.view !== "iv") return;
  const p = S.plan[S.k]; render();
  // 3 schnelle Töne = zügig, 1 tiefer Ton = locker
  Snd.play(p.kind === "fast" ? "fast" : "easy");
  setTimeout(() => { if(S.view === "iv" && S.plan[S.k] === p) speak(p.kind === "fast" && p.round === cfg.iv.rounds ? "Letzte Runde" : IV_NAME[p.kind]); }, 650 / SPEED);
  let lastLeft = null;
  startClock(el => {
    const left = Math.max(0, Math.ceil(p.len - el)), done = S.before + Math.min(el, p.len);
    setText("clock", fmt(left)); setText("totalleft", fmt(Math.max(0, Math.ceil(S.total - done))));
    const bar = $("barfill"); if(bar) bar.style.width = (done / S.total * 100) + "%";
    setRing(1 - Math.min(el, p.len) / p.len);
    if(left !== lastLeft){ const first = lastLeft === null; lastLeft = left; if(!first && left > 0 && left <= 3) Snd.play("tick"); }
    if(el >= p.len){ stopClock(); ivNext(); }
  });
}
function ivNext(){
  S.before += S.plan[S.k].len; S.k++;
  if(S.k < S.plan.length) ivPhase(); else ivFinish();
}
function ivFinish(){
  stopClock(); S.view = "ivdone";
  last.iv = { desc:ivDesc(), date:new Date().toLocaleDateString("de-DE") }; save("ockham.last", last);
  render(); Snd.play("done"); releaseAwake();
}
function ivSummary(){
  const v = cfg.iv;
  return "Intervalllauf, " + S.started.toLocaleDateString("de-DE") + "\n- " + v.warm + " min einlaufen, " + v.rounds + " × " + v.fast + " s zügig / " + v.easy + " s locker, " + v.cool + " min auslaufen\n- Gesamt " + fmt(S.total) + " min";
}

function verdict(reps){
  const lo = (cfg.target - 20) / (cfg.up + cfg.down), hi = (cfg.target + 20) / (cfg.up + cfg.down);
  if(reps >= hi) return "Obergrenze erreicht: nächstes Mal mehr Gewicht in die Weste oder ein schwächeres Band.";
  if(reps < lo) return "Unter dem Zielfenster: nächstes Mal etwas weniger Last oder mehr Band. Gegessen und erholt?";
  return "Im Zielfenster. Gewicht beim nächsten Mal gleich lassen, mehr Wiederholungen anpeilen.";
}
function summary(){
  const d = S.started ? S.started.toLocaleDateString("de-DE") : "";
  const lines = [WORKOUTS[S.wo].name + ", " + d];
  S.results.forEach(r => {
    const reps = r.reps.map(x => String(x).replace(".", ",")).join(" / ");
    lines.push("- " + r.name + ": " + (r.weight || "ohne Angabe") + ", " + reps + " Wdh., " + r.tut.join(" / ") + " s");
  });
  return lines.join("\n");
}

// ---------- Ansichten ----------
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function exHead(){
  const ex = current(), list = items();
  const side = ex.sides === 2 ? (S.side === 0 ? " · links" : " · rechts") : "";
  return `<div><div class="label">${WORKOUTS[S.wo].name} · Übung ${S.i + 1} von ${list.length}${side}${ex.optional ? " · optional" : ""}</div>
    <div class="ex">${esc(ex.name)}</div></div>`;
}
function tutBar(){
  const max = cfg.target + 20, pct = v => (v / max * 100) + "%";
  return `<div><div class="bar"><i id="barfill"></i>
      <span class="tick" style="left:${pct(cfg.target - 20)}"></span><span class="tick" style="left:${pct(cfg.target)}"></span></div>
    <div class="marks"><span style="left:${pct(cfg.target - 20)}">${cfg.target - 20} s</span><span style="left:${pct(cfg.target)}">${cfg.target} s</span></div></div>`;
}

        <label class="check"><input id="c-voice" type="checkbox" ${cfg.voice ? "checked" : ""}> Ansage beim Countdown („drei, zwei, eins“)${S.wo === "I" ? " und bei den Laufphasen" : cfg.trigger === "ruf" ? ". Bleibt stumm, solange das Mikrofon für den Ruf zuhört" : ""}</label>
        <label class="field full"><span class="label">Ton-Technik</span><select id="c-audio">
          <option value="auto" ${cfg.audio !== "wa" ? "selected" : ""}>Audio-Elemente (Standard)</option>
          <option value="wa" ${cfg.audio === "wa" ? "selected" : ""}>Web Audio (stumm bei Stummschalter)</option></select></label>`;
}

  app.dataset.ivk = v === "iv" ? S.plan[S.k].kind : "";
  bind();
  if(v === "mictest") paintTest();
}
function bind(){
  const on = (id, fn) => { const e = $(id); if(e) e.addEventListener("click", fn); };
  document.querySelectorAll("[data-wo]").forEach(b => b.addEventListener("click", () => { S.wo = b.dataset.wo; render(); }));
  ["up","down","target","rest","lead","lower"].forEach(k => { const e = $("c-" + k); if(e) e.addEventListener("change", () => { const n = parseInt(e.value, 10); if(n > 0){ cfg[k] = n; save("ockham.cfg", cfg); render(); } }); });
  { const e = $("c-hold"); if(e) e.addEventListener("change", () => { const n = parseInt(e.value, 10); if(n >= 0){ cfg.hold = n; save("ockham.cfg", cfg); } }); }
  ["warmup","voice","opt"].forEach(k => { const e = $("c-" + k); if(e) e.addEventListener("change", () => { cfg[k] = e.checked; save("ockham.cfg", cfg); if(k === "opt") render(); }); });
  ["audio","trigger"].forEach(k => { const e = $("c-" + k); if(e) e.addEventListener("change", () => { cfg[k] = e.value; save("ockham.cfg", cfg); Snd.ready = false; const open = $("settings") && $("settings").open; render(); if(open && $("settings")) $("settings").open = true; }); });
  { const e = $("c-vol"); if(e) e.addEventListener("change", () => { cfg.vol = parseFloat(e.value); save("ockham.cfg", cfg); if(!Snd.ready) Snd.unlock(); else Snd.setVol(); setTimeout(() => Snd.play("up"), 120); }); }
  { const e = $("c-thr"); if(e) e.addEventListener("input", () => { cfg.thr = lvInv(parseInt(e.value, 10) / 100); save("ockham.cfg", cfg); paintLevel(); }); }
  on("start", begin);
  on("gear", () => { const d = $("settings"); if(d){ d.open = true; d.scrollIntoView({ behavior:"smooth", block:"start" }); } });
  on("ivstart", ivBegin);
  document.querySelectorAll("[data-ivp]").forEach(b => b.addEventListener("click", () => {
    const p = IV_PRESETS.find(x => x.k === b.dataset.ivp); Object.assign(cfg.iv, { rounds:p.rounds, fast:p.fast, easy:p.easy }); save("ockham.cfg", cfg); render(); }));
  ["rounds","fast","easy","warm","cool"].forEach(k => { const e = $("iv-" + k); if(e) e.addEventListener("change", () => {
    const n = parseInt(e.value, 10); if(n >= 0 && !(k === "rounds" && n < 1)){ cfg.iv[k] = n; save("ockham.cfg", cfg); render(); } }); });
  on("testvoice", () => {
    Snd.unlock(); unlockSpeech();
    setText("voicehint", "Du solltest hören: 1 Piep (hoch), 2 Pieps (runter), dann drei Ticks" + (cfg.voice ? " mit „drei, zwei, eins“" : "") + " und einen langen Ton. Ton-Technik: " + (Snd.mode === "wa" ? "Web Audio" : "Audio-Elemente") + ". Kommt nichts: Handy lauter stellen.");
    setTimeout(() => Snd.play("up"), 200);
    setTimeout(() => Snd.play("down"), 1200);
    [3, 2, 1].forEach((n, i) => setTimeout(() => { Snd.play("tick"); speak(NUM[n]); }, 2400 + i * 1000));
    setTimeout(() => Snd.play("go"), 5400);
  });
  on("mictest", () => { Snd.unlock(); S = { view:"mictest", wo:S.wo, fires:0 }; Mic.start(); keepAwake(); render(); });
  on("calib", calibrate);
  on("tonecheck", toneCheck);
  on("warm", startWarmup);
  on("skipwarm", goLead);
  on("go", goLead);
  on("fail", fail);
  on("cntdone", countDone);
  on("skipopt", () => { stopClock(); nextItem(); });
  on("pause", togglePause);
  on("abort", abort);
  on("saveres", saveResult);
  on("home", abort);
  on("skip", () => {
    stopClock(); stopSpeech();
    if(S.view === "iv"){ ivNext(); return; }
    if(S.view === "rest") toReady();
    else if(S.view === "cool") finish();
    else goLead();
  });
  on("copy", () => {
    const t = S.view === "ivdone" ? ivSummary() : summary(), b = $("copy");
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("sum")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Markiert, jetzt kopieren"; };
    try{ navigator.clipboard.writeText(t).then(() => b.textContent = "Kopiert", sel); }catch(e){ sel(); }
  });
}
render();
</script>
</body></html>
